{% extends 'base.html' %}
{% block content %}
<div class="card shadow-sm p-4">
  <h1>Edit Cover Letter</h1>
  <p>{{ letter.cv.full_name }}</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary">Save Changes</button>
      <a href="{% url 'dashboard' %}?letter={{ letter.id }}#dashboard-preview" class="btn btn-outline-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
