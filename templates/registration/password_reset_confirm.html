{% extends "registration/recovery_base.html" %}
{% block recovery_content %}
{% if validlink %}
  <h2>Choose a new password</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary w-100">Save new password</button>
  </form>
{% else %}
  <h2>This link is no longer valid</h2>
  <p>The reset link has expired or has already been used.</p>
  <a href="{% url 'password_reset' %}" class="btn btn-primary w-100">Request a new link</a>
{% endif %}
{% endblock %}
