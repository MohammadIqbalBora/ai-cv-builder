{% extends "registration/recovery_base.html" %}
{% block recovery_content %}
<h2>Forgot username or password?</h2>
<p class="text-muted">Enter the email address you used to register. We will email your username and a password-reset link.</p>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-primary w-100">Email recovery link</button>
</form>
{% endblock %}
